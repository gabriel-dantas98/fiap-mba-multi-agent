name: Deploy Function — QC Catálogo (Aula 3)

# Exercício 3.3 (bônus). Roda só quando o código da Function da Aula 3 muda —
# lint (ruff) + testes (pytest) sempre; publish só em push direto na main,
# usando OIDC (sem client secret salvo no repo).
on:
  push:
    branches: [main]
    paths:
      - "cloud-cognitive/aula03/function/**"
  pull_request:
    branches: [main]
    paths:
      - "cloud-cognitive/aula03/function/**"

permissions:
  contents: read

env:
  FUNCTION_CODE_PATH: cloud-cognitive/aula03/function/v2-full

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install ruff pytest pytest-asyncio
          pip install -r "$FUNCTION_CODE_PATH/requirements.txt"

      - name: Lint (ruff)
        run: ruff check cloud-cognitive/aula03/function/

      - name: Testes (pytest)
        run: pytest cloud-cognitive/aula03/function/tests/ -v

  publish:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # exige aprovação/segredos só neste ambiente
    permissions:
      id-token: write # obrigatório para o login OIDC (az login --federated-token)
      contents: read
    steps:
      - uses: actions/checkout@v7

      # OIDC — sem AZURE_CLIENT_SECRET no repo. O Service Principal do Azure
      # precisa de uma "federated credential" apontando para este repo+branch.
      - name: Login no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Flex Consumption não suporta deployment slots. RollingUpdate substitui
      # instâncias em lotes e preserva execuções em andamento.
      - name: Configurar atualização gradual
        run: |
          az functionapp update-strategy config set \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_FUNCTIONAPP_NAME }}" \
            --type RollingUpdate

      - name: Deploy com RollingUpdate
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.FUNCTION_CODE_PATH }}
          remote-build: true

      - name: Smoke test
        run: |
          FUNCTION_URL="https://${{ secrets.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net"
          curl --fail --retry 5 --retry-all-errors --retry-delay 10 \
            --silent --show-error "$FUNCTION_URL/api/health"
